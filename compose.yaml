services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: naryadai-local:latest
    environment:
      NARYADAI_DATA_DIR: /data
      NARYADAI_HOST: 0.0.0.0
      NARYADAI_PORT: 8765
      NARYADAI_LLM_ENABLED: ${NARYADAI_LLM_ENABLED:-0}
      NARYADAI_LLM_API_URL: ${NARYADAI_LLM_API_URL:-}
      NARYADAI_LLM_API_KEY: ${NARYADAI_LLM_API_KEY:-}
      NARYADAI_LLM_MODEL: ${NARYADAI_LLM_MODEL:-}
      NARYADAI_LLM_REPORT_SUMMARY: ${NARYADAI_LLM_REPORT_SUMMARY:-0}
      NARYADAI_TELEGRAM_ENABLED: ${NARYADAI_TELEGRAM_ENABLED:-0}
      NARYADAI_TELEGRAM_BOT_TOKEN: ${NARYADAI_TELEGRAM_BOT_TOKEN:-}
      NARYADAI_TELEGRAM_WEBHOOK_SECRET: ${NARYADAI_TELEGRAM_WEBHOOK_SECRET:-}
    ports:
      - 127.0.0.1:8765:8765
    volumes:
      - naryadai-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    user: 10001:10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  streamlit-demo:
    profiles: [demo-ui]
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    image: naryadai-streamlit-demo:latest
    environment:
      NARYADAI_API_URL: http://app:8765
    ports:
      - 127.0.0.1:8501:8501
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    user: 10001:10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    restart: unless-stopped
volumes:
  naryadai-data:
